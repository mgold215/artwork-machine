[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artwork-machine"
version = "0.1.0"
description = "Fully automated generator for cassette album art, Spotify Canvas videos, and YouTube visualizers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # AI & generation
    "anthropic>=0.40.0",
    "replicate>=0.34.0",
    # Audio analysis
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    # Image compositing
    "Pillow>=10.3.0",
    "cairosvg>=2.7.1",
    # Video generation
    "moviepy>=1.0.3",
    "ffmpeg-python>=0.2.0",
    # CLI & UX
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    # HTTP & utilities
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.scripts]
artwork-machine = "artwork_machine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artwork_machine"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
